version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geosuite-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - geosuite_data:/app/data
      - /usr/share/gdal
      - /usr/share/proj
    env_file:
      - ./backend/.env
    environment:
      - GDAL_DATA=/usr/share/gdal
      - PROJ_LIB=/usr/share/proj
      - PYTHONPATH=/opt/geosuite/lib:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - geosuite-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geosuite-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - geosuite-network

  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geosuite-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geosuite}
      POSTGRES_USER: ${POSTGRES_USER:-geosuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - geosuite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geosuite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: geosuite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - geosuite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for async tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: geosuite-celery
    volumes:
      - ./backend:/app
      - geosuite_data:/app/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-geosuite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geosuite}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geosuite-network
    command: celery -A app.workers.celery_worker worker --loglevel=info --concurrency=4

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: geosuite-celery-beat
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-geosuite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geosuite}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geosuite-network
    command: celery -A app.workers.celery_worker beat --loglevel=info

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: geosuite-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - geosuite-network

  # Traefik for load balancing (Alternative to Nginx)
  traefik:
    image: traefik:v2.10
    container_name: geosuite-traefik
    command:
      - "--api.insecure=${TRAEFIK_API_INSECURE:-false}"
      - "--api.dashboard=${TRAEFIK_API_INSECURE:-false}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
    depends_on:
      - backend
      - frontend
    networks:
      - geosuite-network

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4
    container_name: geosuite-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@geosuite.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - geosuite-network

  # MinIO for file storage (S3 compatible)
  minio:
    image: minio/minio
    container_name: geosuite-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - geosuite-network

  # Flower for Celery monitoring
  flower:
    image: mher/flower
    container_name: geosuite-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - celery-worker
    networks:
      - geosuite-network

  # OpenDroneMap for drone image photogrammetry
  odm:
    image: opendronemap/odm
    container_name: geosuite-odm
    volumes:
      - ./data/drone_surveys:/datasets
    entrypoint: ["python", "run.py", "--project-path", "/datasets"]
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - geosuite-network

networks:
  geosuite-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  geosuite_data:
  minio_data: